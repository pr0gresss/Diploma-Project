name: ai-study-workspace

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: study_workspace
      POSTGRES_USER: study
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in CI/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U study -d study_workspace"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: CI/backend.Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://study:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in CI/.env}@db:5432/study_workspace?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  tika:
    image: ${TIKA_IMAGE:-apache/tika:latest-full}
    restart: unless-stopped
    # Only other containers can reach Tika; do not publish its parser API.
    expose:
      - "9998"
    environment:
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx768m"
    mem_limit: 1g
    cpus: 1.0

  backend:
    build:
      context: .
      dockerfile: CI/backend.Dockerfile
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://study:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in CI/.env}@db:5432/study_workspace?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in CI/.env}
      JWT_ISSUER: ai-study-workspace
      JWT_AUDIENCE: ai-study-workspace-api
      JWT_ACCESS_TTL: 15m
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-45000}
      LLM_MAX_CONTEXT_CHARS: ${LLM_MAX_CONTEXT_CHARS:-60000}
      LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-8192}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_ROOT: /app/.storage
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      # Extraction worker uses the private Tika service.
      TIKA_URL: http://tika:9998
      TIKA_TIMEOUT_MS: ${TIKA_TIMEOUT_MS:-60000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - object-storage:/app/.storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      tika:
        condition: service_started
    healthcheck:
      # No public HTTP health endpoint exists yet; check the listening socket.
      test:
        - CMD
        - node
        - --input-type=module
        - -e
        - "import net from 'node:net'; const s = net.connect(3000, '127.0.0.1'); s.setTimeout(2000); s.on('connect', () => { s.end(); process.exit(0); }); s.on('error', () => process.exit(1)); s.on('timeout', () => process.exit(1));"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: CI/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

  seed:
    image: postgres:17-alpine
    profiles: ["tools"]
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in CI/.env}
    volumes:
      - ./Backend/prisma/seed.sql:/seed/seed.sql:ro
    entrypoint: ["psql"]
    command:
      [
        "-h",
        "db",
        "-U",
        "study",
        "-d",
        "study_workspace",
        "-v",
        "ON_ERROR_STOP=1",
        "-f",
        "/seed/seed.sql",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  object-storage:
