<div class="dialog-backdrop" (click)="cancel.emit()"></div>

<div
  class="dialog"
  role="dialog"
  aria-modal="true"
  aria-labelledby="logout-title"
  aria-describedby="logout-copy"
  (keydown.escape)="cancel.emit()"
>
  <p class="eyebrow">SIGN OUT</p>
  <h2 id="logout-title" class="serif">Log out?</h2>
  <p id="logout-copy" class="dialog-copy">
    You’ll need to sign in again to return to your workspaces.
  </p>
  @if (email()) {
    <p class="dialog-email">{{ email() }}</p>
  }

  <div class="dialog-actions">
    <button #cancelButton type="button" class="btn secondary" (click)="cancel.emit()">
      Cancel
    </button>
    <button type="button" class="btn danger" (click)="confirm.emit()">Log out</button>
  </div>
</div>
