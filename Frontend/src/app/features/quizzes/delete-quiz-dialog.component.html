<div class="dialog-backdrop" (click)="cancel.emit()"></div>

<div
  class="dialog"
  role="dialog"
  aria-modal="true"
  aria-labelledby="delete-quiz-title"
  aria-describedby="delete-quiz-copy"
  (keydown.escape)="cancel.emit()"
>
  <p class="eyebrow">DANGER ZONE</p>
  <h2 id="delete-quiz-title" class="serif">Delete quiz?</h2>
  <p id="delete-quiz-copy" class="dialog-copy">
    This permanently deletes <strong>{{ quizTitle() || 'this quiz' }}</strong> and its saved attempts.
    This action cannot be undone.
  </p>

  @if (error()) {
    <p class="form-error" role="alert">{{ error() }}</p>
  }

  <div class="dialog-actions">
    <button
      #cancelButton
      type="button"
      class="btn secondary"
      [disabled]="deleting()"
      (click)="cancel.emit()"
    >
      Cancel
    </button>
    <button type="button" class="btn danger" [disabled]="deleting()" (click)="confirm.emit()">
      {{ deleting() ? 'Deleting…' : 'Delete quiz' }}
    </button>
  </div>
</div>
